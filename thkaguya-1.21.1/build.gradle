plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    // AT 文件放在默认位置 src/main/resources/META-INF/accesstransformer.cfg，MDG 会自动读取；
    // 打开校验可以第一时间抓出"从 1.20.1 直接抄过来的 SRG 名"这类错误。
    validateAccessTransformers = true

    runs {
        client {
            client()
            // 客户端与专用服务器必须用不同的 gameDir：共用一个 run/ 会互相抢
            // options.txt / logs/latest.log / saves，表现为"日志被另一个进程覆盖"。
            gameDirectory = file('run/client')
            // 便于本地联机自测（验证数据组件的 networkSynchronized 是否真的生效）：
            //   g.bat runClient -PquickPlay=127.0.0.1:25566
            if (project.hasProperty('quickPlay')) {
                programArgument '--quickPlayMultiplayer'
                programArgument project.property('quickPlay').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run/server')
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 迁移期要把"全部错误"一次看全（javac 默认到 100 条就停）
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

// 迁移辅助：把编译类路径导出到文件，便于直接用 javac 跑（Gradle 会把诊断信息按 80 列截断/折断，
// 直接调用 javac 才能拿到完整的 "cannot find symbol" / "required: ... found: ..." 文本）。
tasks.register('dumpCompileCp') {
    def outFile = layout.buildDirectory.file('compile-cp.txt')
    doLast {
        outFile.get().asFile.text = sourceSets.main.compileClasspath.asPath
    }
}
