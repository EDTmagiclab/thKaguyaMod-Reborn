# ---------------------------------------------------------------------------
# 1.21.1 / NeoForge 21.1 开发环境（分支 port/1.21.1-neoforge）
# 注意：本文件里的设置只作用于本工程，不修改 %USERPROFILE%\.gradle\gradle.properties，
#       因此不会影响 thkaguya-1.20.1 的 Forge 构建链（gradle 8.1.1 + jdk-17）。
# ---------------------------------------------------------------------------

# 代理不要写在这里！%USERPROFILE%\.gradle\gradle.properties 里有
#   systemProp.http(s).proxyPort=10195（已失效的端口）
# 它会被追加到守护进程 JVM 参数末尾，覆盖本工程任何代理配置（含 org.gradle.jvmargs 里的 -D）。
# 所以代理放在 g.bat 的命令行 -D 里（命令行优先级最高），见 g.bat。
# 编译诊断要英文 + UTF-8 输出（javac 默认跟随系统中文 locale，日志会变 GBK 乱码）
org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false

# 本工程固定用 JDK 21 跑 Gradle（1.20.1 工程仍用 jdk-17，互不干扰）
org.gradle.java.home=C:\\Java\\jdk-21

# --- 版本钉选 ---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.249
neo_version_range=[21.1.0,)
loader_version_range=[1,)

mod_id=thkaguya
mod_name=THKaguya
